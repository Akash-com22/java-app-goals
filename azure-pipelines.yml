trigger:
- master

pool:
  vmImage: ubuntu-latest

variables:
- group: Test

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- task: replacetokens@6
  inputs:
    sources: 'pom.xml'
    tokenPattern: 'azpipelines'
